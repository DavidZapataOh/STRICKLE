name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      ARC_FOUNDRY_VERSION: v0.8.0-2
      FOUNDRY_PROFILE: ci
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/cache@v6
        id: arc-foundry
        with:
          path: ~/.local/bin
          key: arc-foundry-${{ env.ARC_FOUNDRY_VERSION }}
      - name: Install Arc Foundry
        if: steps.arc-foundry.outputs.cache-hit != 'true'
        run: |
          archive="arc-foundry-${ARC_FOUNDRY_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          base="https://github.com/circlefin/arc-foundry/releases/download/${ARC_FOUNDRY_VERSION}"
          curl -fsSL -O "$base/$archive" -O "$base/$archive.sha256"
          sha256sum -c "$archive.sha256"
          tar -xzf "$archive"
          mkdir -p ~/.local/bin
          mv forge ~/.local/bin/arc-forge
          mv cast ~/.local/bin/arc-cast
          mv anvil ~/.local/bin/arc-anvil
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  arc-live:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      CIRCLE_API_KEY_TESTNET: ${{ secrets.CIRCLE_API_KEY_TESTNET }}
      CIRCLE_ENTITY_SECRET_TESTNET: ${{ secrets.CIRCLE_ENTITY_SECRET_TESTNET }}
      CIRCLE_GAS_STATION_SCA_WALLET_ID: ${{ secrets.CIRCLE_GAS_STATION_SCA_WALLET_ID }}
      CIRCLE_GAS_STATION_EOA_WALLET_ID: ${{ secrets.CIRCLE_GAS_STATION_EOA_WALLET_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:integration -w @strickle/arc

  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strickle
          POSTGRES_PASSWORD: strickle
          POSTGRES_DB: strickle
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U strickle"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://strickle:strickle@localhost:54329/strickle
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:integration -w @strickle/db
