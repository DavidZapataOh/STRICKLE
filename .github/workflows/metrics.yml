name: Record metrics

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    # Off until the owner sets the repository variable METRICS_ENABLED to "true" and adds the DATABASE_URL secret ([owner OK]).
    # The team list and the policy are read from the repository (apps/app/src/config); the network defaults to testnet until the app runs on mainnet.
    if: vars.METRICS_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run record-metrics -w app -- ${{ vars.METRICS_NETWORK || 'testnet' }}
