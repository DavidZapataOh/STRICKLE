title = "strickle gitleaks config"

# Extends a pinned, vendored copy of gitleaks' own default ruleset
# (.gitleaks/gitleaks.toml, copied verbatim from
# https://github.com/gitleaks/gitleaks/blob/v8.30.1/config/gitleaks.toml)
# instead of `useDefault = true`. Every rule in that file is inherited
# unmodified; the only edit made to the vendored copy is removing the
# lockfile entry from its global path allowlist. gitleaks appends path
# allowlists when a config extends another one — it never subtracts from
# them — so `useDefault = true` cannot re-include a path the default config
# excludes. See .gitleaks/README.md.
[extend]
path = ".gitleaks/gitleaks.toml"

[[rules]]
id = "strickle-wallet-seed-env"
description = "Strickle MIDNIGHT_WALLET_SEED assigned a long hex value"
regex = '''(?i)MIDNIGHT_WALLET_SEED\s*=\s*["']?([a-f0-9]{32,})["']?'''
secretGroup = 1
keywords = ["MIDNIGHT_WALLET_SEED"]
tags = ["midnight", "wallet", "seed"]

[[rules]]
id = "strickle-wallet-mnemonic-env"
description = "Strickle MIDNIGHT_WALLET_MNEMONIC assigned a long recovery phrase"
regex = '''(?i)MIDNIGHT_WALLET_MNEMONIC\s*=\s*["']?((?:[a-z]+\s+){11,}[a-z]+)["']?'''
secretGroup = 1
keywords = ["MIDNIGHT_WALLET_MNEMONIC"]
tags = ["midnight", "wallet", "mnemonic"]

[[rules]]
id = "strickle-bare-seed-hex"
description = "Bare 64/128-char hex literal near the word seed or mnemonic"
regex = '''(?i)(?:\b(?:seed|mnemonic)\b.{0,40}?\b([a-f0-9]{64}(?:[a-f0-9]{64})?)\b|\b([a-f0-9]{64}(?:[a-f0-9]{64})?)\b.{0,40}?\b(?:seed|mnemonic)\b)'''
keywords = ["seed", "mnemonic"]
tags = ["midnight", "wallet", "seed", "mnemonic"]
