[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.36"
evm_version = "osaka"
optimizer = true
optimizer_runs = 200
remappings = ["poseidon2-evm/=lib/poseidon2-evm/"]
fs_permissions = [{ access = "read", path = "../packages/pool/vectors" }, { access = "read", path = "test/fixtures/proofs" }, { access = "read", path = "test/fixtures/pool" }]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64
fail_on_revert = true

[profile.ci.fuzz]
runs = 10000

[profile.ci.invariant]
runs = 1024
depth = 128

[fmt]
ignore = ["src/pool/verifiers/*.sol"]

[lint]
ignore = ["src/pool/verifiers/*.sol"]
