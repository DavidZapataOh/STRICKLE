services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: strickle
      POSTGRES_PASSWORD: strickle
      POSTGRES_DB: strickle
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strickle"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - strickle-db:/var/lib/postgresql/data

volumes:
  strickle-db:
